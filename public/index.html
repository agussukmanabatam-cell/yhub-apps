<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F0F2F8" />
<title>Sign In — Y-HUB</title>
<script src="auth-guard.js"></script>

<!-- Font Poppins -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #EEF1F8;
    --card: #F5F7FB;
    --text: #1A1D2E;
    --muted: #8B92A8;
    --primary: #2563EB;
    --primary-dark: #1E40AF;
    --accent: #3B82F6;
    --success: #10B981;
    --danger: #EF4444;
    --shadow-out:
      8px 8px 20px rgba(174,184,205,0.55),
      -8px -8px 20px rgba(255,255,255,0.95);
    --shadow-in:
      inset 6px 6px 12px rgba(174,184,205,0.55),
      inset -6px -6px 12px rgba(255,255,255,0.9);
    --shadow-btn:
      6px 6px 16px rgba(37,99,235,0.35),
      -4px -4px 12px rgba(255,255,255,0.6);
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  html, body {
    height:100%;
    font-family: 'Poppins', -apple-system, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow:hidden;
    overscroll-behavior:none;
  }

  /* Background decor */
  body::before, body::after {
    content:'';
    position:fixed;
    border-radius:50%;
    z-index:0;
    pointer-events:none;
  }
  body::before {
    width:280px; height:280px;
    background: radial-gradient(circle at 30% 30%, #C7D5F5, #B0C2EA);
    top:-100px; left:-100px;
    box-shadow: inset -10px -10px 30px rgba(255,255,255,0.4), 20px 20px 60px rgba(140,160,200,0.3);
  }
  body::after {
    width:220px; height:220px;
    background: radial-gradient(circle at 40% 40%, #D4DEF6, #B8C7E8);
    bottom:-90px; right:-80px;
    box-shadow: inset -8px -8px 20px rgba(255,255,255,0.5), 15px 15px 40px rgba(140,160,200,0.25);
  }

  /* Theme toggle */
  .theme-toggle {
    position:fixed;
    top: calc(env(safe-area-inset-top) + 16px);
    right:16px;
    width:44px; height:44px;
    border-radius:50%;
    background:var(--card);
    border:none;
    box-shadow: var(--shadow-out);
    display:grid; place-items:center;
    font-size:16px;
    cursor:pointer;
    z-index:10;
    transition: all .2s;
  }
  .theme-toggle:active { box-shadow: var(--shadow-in); transform: scale(.95); }

  /* App */
  .app {
    position:relative;
    z-index:1;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    padding: calc(env(safe-area-inset-top) + 80px) 24px
             calc(env(safe-area-inset-bottom) + 24px);
    overflow-y:auto;
    -webkit-overflow-scrolling: touch;
  }

  /* Logo card — teks Y-HUB aja, no icon */
  .logo-card {
    width:96px; height:96px;
    border-radius:28px;
    background: linear-gradient(135deg, #3B82F6 0%, #2563EB 50%, #1E40AF 100%);
    box-shadow:
      8px 8px 24px rgba(37,99,235,0.35),
      -4px -4px 12px rgba(255,255,255,0.6);
    display:grid; place-items:center;
    margin: 0 auto 28px;
    color: white;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.03em;
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }

  /* Title */
  .title { text-align:center; margin-bottom:32px; }
  .title h1 {
    font-size:30px;
    font-weight:800;
    letter-spacing:-0.03em;
    margin-bottom:8px;
  }
  .title p {
    font-size:12px;
    color:var(--muted);
    letter-spacing:0.2em;
    text-transform:uppercase;
    font-weight:500;
  }

  /* Form */
  .form { width:100%; max-width:400px; margin:0 auto; }
  .field { margin-bottom:16px; }

  /* Neumorphic input — no icon */
  .neu-input {
    position:relative;
    background:var(--card);
    border-radius:20px;
    box-shadow: var(--shadow-out);
    transition: all .25s;
    overflow:hidden;
  }
  .neu-input.focused { box-shadow: var(--shadow-in); }
  .neu-input.error {
    box-shadow: inset 6px 6px 12px rgba(239,68,68,0.15),
                inset -6px -6px 12px rgba(255,255,255,0.9),
                0 0 0 2px rgba(239,68,68,0.3);
    animation: shake .4s;
  }
  .neu-input.success {
    box-shadow: inset 6px 6px 12px rgba(16,185,129,0.12),
                inset -6px -6px 12px rgba(255,255,255,0.9),
                0 0 0 2px rgba(16,185,129,0.25);
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  .neu-input input {
    width:100%;
    padding:18px 52px 18px 20px;
    font-size:15px;
    font-family:'Poppins', sans-serif;
    font-weight:500;
    color:var(--text);
    background:transparent;
    border:none;
    outline:none;
  }
  .neu-input input::placeholder {
    color:#A8B0C5;
    font-weight:400;
  }
  .neu-input input[readonly] { color:var(--muted); }

  .status-icon {
    position:absolute;
    right:20px; top:50%;
    transform:translateY(-50%);
    font-size:14px;
    font-weight:700;
    pointer-events:none;
  }
  .status-icon.ok { color: var(--success); }
  .status-icon.err { color: var(--danger); }

  /* Hirarki picker */
  .picker {
    width:100%;
    padding:18px 52px 18px 20px;
    font-size:15px;
    font-family:'Poppins', sans-serif;
    font-weight:500;
    color:var(--text);
    background:var(--card);
    border:none;
    border-radius:20px;
    box-shadow: var(--shadow-out);
    text-align:left;
    cursor:pointer;
    transition: all .2s;
    position:relative;
  }
  .picker:active { box-shadow: var(--shadow-in); }
  .picker.placeholder { color:#A8B0C5; font-weight:400; }
  .picker .chev {
    position:absolute;
    right:20px;
    top:50%;
    transform:translateY(-50%);
    font-size:12px;
    color:var(--muted);
    transition: transform .2s;
  }

  /* Remember row */
  .row-between {
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin: 8px 4px 24px;
    font-size:13px;
  }
  .remember {
    display:flex;
    align-items:center;
    gap:8px;
    cursor:pointer;
    color:var(--text);
    font-weight:500;
  }
  .remember input { display:none; }
  .checkbox {
    width:20px; height:20px;
    border-radius:6px;
    background:var(--card);
    box-shadow: var(--shadow-out);
    display:grid; place-items:center;
    transition: all .2s;
    font-size:11px;
    color:white;
    font-weight:700;
  }
  .remember input:checked + .checkbox {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    box-shadow: 4px 4px 10px rgba(37,99,235,0.4);
  }
  .checkbox::after { content:'✓'; opacity:0; transition:opacity .2s; }
  .remember input:checked + .checkbox::after { opacity:1; }

  .forgot {
    color: var(--primary);
    text-decoration:none;
    font-weight:600;
  }

  /* Login button */
  .btn-login {
    width:100%;
    padding:18px 24px;
    font-size:16px;
    font-weight:700;
    font-family:'Poppins', sans-serif;
    color:white;
    background: linear-gradient(135deg, #3B82F6 0%, #2563EB 50%, #1E40AF 100%);
    border:none;
    border-radius:20px;
    box-shadow: var(--shadow-btn);
    cursor:pointer;
    transition: all .2s;
    display:flex;
    align-items:center;
    justify-content:space-between;
    letter-spacing:-0.01em;
    position:relative;
  }
  .btn-login:active {
    transform: scale(.98);
    box-shadow: inset 4px 4px 10px rgba(0,0,0,0.2);
  }
  .btn-login:disabled { opacity:.7; pointer-events:none; }
  .btn-login .arrow {
    width:32px; height:32px;
    border-radius:50%;
    background: rgba(255,255,255,0.2);
    display:grid; place-items:center;
    font-size:14px;
    transition: transform .2s;
  }
  .btn-login .spinner {
    width:16px; height:16px;
    border:2px solid rgba(255,255,255,.3);
    border-top-color:white;
    border-radius:50%;
    animation: spin .8s linear infinite;
    display:inline-block;
    margin-right: 8px;
    vertical-align: -3px;
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* Divider */
  .divider {
    display:flex;
    align-items:center;
    gap:12px;
    margin: 28px 0 16px;
    color: var(--muted);
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    font-weight:600;
  }
  .divider::before, .divider::after {
    content:'';
    flex:1;
    height:1px;
    background: linear-gradient(to right, transparent, #D0D6E5, transparent);
  }

  /* Admin button */
  .admin-btn {
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    width:100%;
    padding:16px;
    background: var(--card);
    border:none;
    border-radius:20px;
    box-shadow: var(--shadow-out);
    font-size:14px;
    font-weight:600;
    font-family:'Poppins', sans-serif;
    color: var(--text);
    cursor:pointer;
    transition: all .2s;
  }
  .admin-btn:active { box-shadow: var(--shadow-in); transform: scale(.98); }

  /* Tagline */
  .tagline {
    text-align:center;
    margin-top:28px;
    font-size:10px;
    letter-spacing:0.2em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:600;
  }
  .tagline span { margin: 0 6px; opacity:.5; }

  /* Bottom Sheet */
  .sheet-overlay {
    position:fixed; inset:0;
    background: rgba(20,30,60,0.35);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index:100;
    opacity:0;
    pointer-events:none;
    transition: opacity .3s;
  }
  .sheet-overlay.open { opacity:1; pointer-events:auto; }

  .bottom-sheet {
    position:fixed;
    left:0; right:0; bottom:0;
    background: var(--bg);
    border-radius: 32px 32px 0 0;
    padding: 12px 0 calc(env(safe-area-inset-bottom) + 20px);
    z-index:101;
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.2,.9,.3,1.1);
    max-height: 85vh;
    display:flex;
    flex-direction:column;
    box-shadow: 0 -20px 60px rgba(140,160,200,0.3);
  }
  .bottom-sheet.open { transform: translateY(0); }

  .sheet-handle {
    width:44px; height:5px;
    background: #C7CFE0;
    border-radius:3px;
    margin: 0 auto 20px;
  }
  .sheet-title {
    font-size:19px;
    font-weight:800;
    padding: 0 24px;
    margin-bottom:4px;
    letter-spacing:-0.02em;
  }
  .sheet-sub {
    font-size:12px;
    color:var(--muted);
    padding: 0 24px;
    margin-bottom:16px;
    font-weight: 500;
  }
  .search-wrap { padding: 0 20px 12px; position:relative; }
  .search-wrap input {
    width:100%;
    padding: 14px 16px;
    font-size:14px;
    font-family:'Poppins', sans-serif;
    color:var(--text);
    background: var(--card);
    border:none;
    border-radius:16px;
    box-shadow: var(--shadow-in);
    outline:none;
    font-weight: 500;
  }
  .search-wrap input::placeholder { color:#A8B0C5; font-weight:400; }

  .sheet-list {
    overflow-y:auto;
    padding: 8px 16px 16px;
    -webkit-overflow-scrolling:touch;
  }

  /* Option — no icon */
  .option {
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px;
    border-radius:16px;
    cursor:pointer;
    transition: all .2s;
    font-size:15px;
    font-weight:600;
    margin-bottom:6px;
    background: transparent;
    font-family: 'Poppins', sans-serif;
  }
  .option:active { transform: scale(.98); }
  .option.selected {
    background: linear-gradient(135deg, #2563EB, #1E40AF);
    color:white;
    box-shadow: 4px 4px 12px rgba(37,99,235,0.35);
  }
  .option .check { opacity:0; font-weight:700; }
  .option.selected .check { opacity:1; }

  /* Modal */
  .modal-overlay {
    position:fixed; inset:0;
    background: rgba(20,30,60,0.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index:200;
    display:grid;
    place-items:center;
    padding:24px;
    opacity:0;
    pointer-events:none;
    transition:opacity .3s;
  }
  .modal-overlay.open { opacity:1; pointer-events:auto; }

  .modal-card {
    width:100%;
    max-width:360px;
    background: var(--bg);
    border-radius:28px;
    padding:32px 24px 24px;
    box-shadow: 0 30px 60px rgba(140,160,200,0.4);
    transform: scale(.9);
    transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
    text-align:center;
  }
  .modal-overlay.open .modal-card { transform: scale(1); }

  .modal-title {
    font-size:19px;
    font-weight:800;
    margin-bottom:10px;
    letter-spacing:-0.02em;
  }
  .modal-desc {
    font-size:14px;
    color:var(--muted);
    line-height:1.6;
    margin-bottom:24px;
    font-weight: 500;
  }
  .modal-actions { display:flex; gap:10px; }
  .modal-actions button {
    flex:1;
    padding:14px;
    font-size:14px;
    font-weight:700;
    font-family:'Poppins', sans-serif;
    border-radius:16px;
    cursor:pointer;
    transition: all .2s;
    border:none;
  }
  .modal-actions .btn-ghost {
    background: var(--card);
    box-shadow: var(--shadow-out);
    color: var(--text);
  }
  .modal-actions .btn-primary {
    background: linear-gradient(135deg, #2563EB, #1E40AF);
    color:white;
    box-shadow: 4px 4px 12px rgba(37,99,235,0.35);
  }
  .modal-actions button:active { transform: scale(.97); }

  /* Toast */
  .toast {
    position:fixed;
    left:50%; bottom: calc(env(safe-area-inset-bottom) + 24px);
    transform: translateX(-50%) translateY(100px);
    padding:12px 20px;
    background: var(--bg);
    border-radius:999px;
    font-size:13px;
    font-weight:600;
    font-family:'Poppins', sans-serif;
    z-index:300;
    transition: transform .3s cubic-bezier(.2,.9,.3,1.2);
    box-shadow: 0 10px 30px rgba(140,160,200,0.4);
    display:flex;
    align-items:center;
    gap:8px;
    color: var(--text);
    max-width: calc(100vw - 40px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Loading dots */
  .loading-dots { display:inline-flex; gap:3px; }
  .loading-dots span {
    width:4px; height:4px; border-radius:50%;
    background: var(--primary);
    animation: dot 1.2s infinite;
  }
  .loading-dots span:nth-child(2) { animation-delay:.15s; }
  .loading-dots span:nth-child(3) { animation-delay:.3s; }
  @keyframes dot {
    0%,60%,100% { opacity:.3; transform:scale(.8); }
    30% { opacity:1; transform:scale(1); }
  }

  /* Dark mode */
  body.dark {
    --bg: #12141C;
    --card: #1A1D28;
    --text: #ECEEF5;
    --muted: #6B7280;
    --shadow-out:
      8px 8px 20px rgba(0,0,0,0.5),
      -8px -8px 20px rgba(255,255,255,0.03);
    --shadow-in:
      inset 6px 6px 12px rgba(0,0,0,0.5),
      inset -6px -6px 12px rgba(255,255,255,0.03);
  }
  body.dark::before {
    background: radial-gradient(circle at 30% 30%, #1F2937, #111827);
    box-shadow: inset -10px -10px 30px rgba(255,255,255,0.03), 20px 20px 60px rgba(0,0,0,0.5);
  }
  body.dark::after {
    background: radial-gradient(circle at 40% 40%, #1E293B, #0F172A);
    box-shadow: inset -8px -8px 20px rgba(255,255,255,0.03), 15px 15px 40px rgba(0,0,0,0.4);
  }
  body.dark .bottom-sheet { background: #12141C; }
  body.dark .sheet-handle { background: #333A48; }
  body.dark .divider::before, body.dark .divider::after {
    background: linear-gradient(to right, transparent, #2A3040, transparent);
  }
</style>
</head>
<body>

<button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">🌙</button>

<div class="app">

  <div class="logo-card">Y-HUB</div>

  <div class="title">
    <h1>Welcome Back</h1>
    <p>Sign in to continue</p>
  </div>

  <div class="form">

    <!-- Hirarki -->
    <div class="field">
      <button class="picker placeholder" id="hirarkiBtn" type="button">
        <span id="hirarkiText">Select Job Hierarchy</span>
        <span class="chev">▼</span>
      </button>
    </div>

    <!-- NIK -->
    <div class="field">
      <div class="neu-input" id="nikWrap">
        <input type="text" id="nik" inputmode="numeric" placeholder="Enter your NIK" autocomplete="off" maxlength="12" />
        <span class="status-icon" id="nikIcon"></span>
      </div>
    </div>

    <!-- Nama -->
    <div class="field">
      <div class="neu-input">
        <input type="text" id="nama" placeholder="Full name (auto-filled)" readonly />
      </div>
    </div>

    <div class="row-between">
      <label class="remember">
        <input type="checkbox" id="remember" />
        <span class="checkbox"></span>
        <span>Remember me 30 days</span>
      </label>
      <a href="#" class="forgot" id="forgotBtn">Forgot access?</a>
    </div>

    <button class="btn-login" id="btnLogin">
      <span id="btnText">Sign In</span>
      <span class="arrow" id="btnArrow">→</span>
    </button>

    <div class="divider">Or continue with</div>

    <button class="admin-btn" id="contactAdmin">
      Contact Administrator
    </button>

    <div class="tagline">
      Secure <span>•</span> Reliable <span>•</span> Simple
    </div>

  </div>
</div>

<!-- Bottom Sheet -->
<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="bottom-sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Select Hierarchy</div>
  <div class="sheet-sub">Choose your position</div>
  <div class="search-wrap">
    <input type="text" id="searchHirarki" placeholder="Search position..." />
  </div>
  <div class="sheet-list" id="hirarkiList"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal-card">
    <div class="modal-title" id="modalTitle">Title</div>
    <div class="modal-desc" id="modalDesc">Description</div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
if (typeof redirectIfLoggedIn === "function" && redirectIfLoggedIn()) { throw new Error("Already logged in — redirecting"); }
/* ============================================
   FIREBASE CONFIG — Ganti dengan config kamu
   ============================================ */
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js';
import {
  getFirestore, doc, getDoc, updateDoc, serverTimestamp, collection, getDocs
} from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBGuX3CiF8sEEfuNxcdJpRHetHl6ATtiVQ",
  authDomain: "y-hub-login.firebaseapp.com",
  projectId: "y-hub-login",
  storageBucket: "y-hub-login.firebasestorage.app",
  messagingSenderId: "439825695894",
  appId: "1:439825695894:web:45f6f388f9730af5342eb7",
  measurementId: "G-2QGX0VKB42"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

/* ============================================
   HIRARKI — hardcode (cuma 5, jarang berubah)
   ============================================ */
const HIRARKI_LIST = [
  "Ordinary Supervisor II",
  "Rayon Koordinator",
  "Center Coordinator",
  "Sales Staff",
];

/* ============================================
   STATE
   ============================================ */
let selectedHirarki = null;
let isSubmitting = false;

/* ============================================
   ELEMEN
   ============================================ */
const $ = id => document.getElementById(id);
const hirarkiBtn   = $('hirarkiBtn');
const hirarkiText  = $('hirarkiText');
const nikInput     = $('nik');
const nikWrap      = $('nikWrap');
const nikIcon      = $('nikIcon');
const namaInput    = $('nama');
const btnLogin     = $('btnLogin');
const btnText      = $('btnText');
const sheet        = $('sheet');
const sheetOverlay = $('sheetOverlay');
const hirarkiList  = $('hirarkiList');
const searchInput  = $('searchHirarki');
const modalOverlay = $('modalOverlay');
const modalTitle   = $('modalTitle');
const modalDesc    = $('modalDesc');
const modalActions = $('modalActions');
const toast        = $('toast');

/* ============================================
   RENDER HIRARKI
   ============================================ */
function renderHirarki(filter = '') {
  const f = filter.toLowerCase();
  const items = HIRARKI_LIST.filter(h => h.toLowerCase().includes(f));

  if (!items.length) {
    hirarkiList.innerHTML = `<div style="padding:24px;text-align:center;color:var(--muted);font-size:13px;">
      No results found.
    </div>`;
    return;
  }

  hirarkiList.innerHTML = items.map(h => `
    <div class="option ${selectedHirarki === h ? 'selected' : ''}" data-value="${h}">
      <span>${h}</span>
      <span class="check">✓</span>
    </div>
  `).join('');

  hirarkiList.querySelectorAll('.option').forEach(opt => {
    opt.onclick = () => {
      selectedHirarki = opt.dataset.value;
      hirarkiText.textContent = selectedHirarki;
      hirarkiBtn.classList.remove('placeholder');
      closeSheet();
      setTimeout(() => nikInput.focus(), 400);
    };
  });
}

/* ============================================
   BOTTOM SHEET
   ============================================ */
function openSheet() {
  sheetOverlay.classList.add('open');
  sheet.classList.add('open');
  document.body.style.overflow = 'hidden';
  setTimeout(() => searchInput.focus(), 300);
}
function closeSheet() {
  sheetOverlay.classList.remove('open');
  sheet.classList.remove('open');
  document.body.style.overflow = '';
  searchInput.value = '';
  renderHirarki();
}
hirarkiBtn.onclick = openSheet;
sheetOverlay.onclick = closeSheet;
searchInput.oninput = e => renderHirarki(e.target.value);

/* ============================================
   AUTOFILL FROM FIRESTORE
   ============================================ */
let debounce;
nikInput.addEventListener('input', e => {
  e.target.value = e.target.value.replace(/\D/g, '');
  const nik = e.target.value.trim();
  clearTimeout(debounce);

  nikWrap.classList.remove('error', 'success');
  nikIcon.textContent = '';
  nikIcon.className = 'status-icon';

  if (nik.length < 4) { namaInput.value = ''; return; }

  nikIcon.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';

  debounce = setTimeout(async () => {
    try {
      const snap = await getDoc(doc(db, 'users', nik));

      if (snap.exists()) {
        const u = snap.data();
        typewriter(namaInput, u.nama, 25);
        nikWrap.classList.add('success');
        nikIcon.textContent = '✓';
        nikIcon.className = 'status-icon ok';

        // Auto-set hirarki dari data user
        if (u.hirarki) {
          selectedHirarki = u.hirarki;
          hirarkiText.textContent = u.hirarki;
          hirarkiBtn.classList.remove('placeholder');
        }
      } else {
        nikWrap.classList.add('error');
        nikIcon.textContent = '✕';
        nikIcon.className = 'status-icon err';
        namaInput.value = '';
      }
    } catch (err) {
      console.error(err);
      nikIcon.textContent = '';
      showToast('Connection error', '⚠️');
    }
  }, 400);
});

nikInput.addEventListener('focus', () => nikWrap.classList.add('focused'));
nikInput.addEventListener('blur',  () => nikWrap.classList.remove('focused'));

function typewriter(el, text, speed = 25) {
  el.value = '';
  let i = 0;
  const tick = () => { if (i < text.length) { el.value += text[i++]; setTimeout(tick, speed); } };
  tick();
}

/* ============================================
   TOAST & MODAL
   ============================================ */
function showToast(msg, emoji = 'ℹ️') {
  toast.innerHTML = `<span>${emoji}</span><span>${msg}</span>`;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

function showModal({ title, desc, actions }) {
  modalTitle.textContent = title;
  modalDesc.innerHTML = desc;
  modalActions.innerHTML = '';
  actions.forEach(a => {
    const btn = document.createElement('button');
    btn.className = a.primary ? 'btn-primary' : 'btn-ghost';
    btn.textContent = a.label;
    btn.onclick = () => { closeModal(); a.onClick?.(); };
    modalActions.appendChild(btn);
  });
  modalOverlay.classList.add('open');
}
function closeModal() { modalOverlay.classList.remove('open'); }
modalOverlay.onclick = e => { if (e.target === modalOverlay) closeModal(); };

/* ============================================
   LOGIN
   ============================================ */
btnLogin.onclick = async () => {
  if (isSubmitting) return;

  const nik  = nikInput.value.trim();
  const nama = namaInput.value.trim();

  if (!selectedHirarki) {
    showToast('Please select your hierarchy first', '⚠️');
    hirarkiBtn.style.animation = 'shake .4s';
    setTimeout(() => hirarkiBtn.style.animation = '', 400);
    return;
  }
  if (nik.length < 4) {
    nikWrap.classList.add('error');
    nikInput.focus();
    showToast('Invalid NIK format', '⚠️');
    return;
  }
  if (!nama) { showToast('NIK not found', '❌'); return; }

  isSubmitting = true;
  btnLogin.disabled = true;
  btnText.innerHTML = '<span class="spinner"></span> Processing...';
  $('btnArrow').style.display = 'none';

  try {
    const userRef = doc(db, 'users', nik);
    const snap = await getDoc(userRef);

    if (!snap.exists()) { throw new Error('User not found'); }
    const u = snap.data();

    // Validasi hirarki cocok
    if (u.hirarki !== selectedHirarki) {
      throw new Error('Hierarchy does not match our records');
    }

    // Cek device conflict
    const deviceId = localStorage.getItem('deviceId') || crypto.randomUUID();
    localStorage.setItem('deviceId', deviceId);

    if (u.deviceId && u.deviceId !== deviceId) {
      isSubmitting = false;
      btnLogin.disabled = false;
      btnText.textContent = 'Sign In';
      $('btnArrow').style.display = 'grid';

      showModal({
        title: 'Account Already Active',
        desc: `<b>${u.nama}</b> is currently signed in on another device.<br><br>Continuing will log out that device.`,
        actions: [
          { label: 'Cancel', primary: false },
          { label: 'Continue', primary: true, onClick: () => doLogin(nik, u.nama, deviceId) }
        ]
      });
      return;
    }

    await doLogin(nik, u.nama, deviceId);

  } catch (err) {
    console.error(err);
    showToast(err.message || 'Login failed', '❌');
    isSubmitting = false;
    btnLogin.disabled = false;
    btnText.textContent = 'Sign In';
    $('btnArrow').style.display = 'grid';
  }
};

async function doLogin(nik, nama, deviceId) {
  try {
    await updateDoc(doc(db, 'users', nik), {
      deviceId,
      lastLogin: serverTimestamp()
    });

    const session = {
      nik, nama,
      hirarki: selectedHirarki,
      deviceId,
      remember: $('remember').checked,
      expiresAt: $('remember').checked ? Date.now() + 30 * 24 * 60 * 60 * 1000 : null
    };
    localStorage.setItem('session', JSON.stringify(session));

    // Simpan session pakai auth-guard
    if (typeof saveSession === 'function') {
      saveSession({
        nik, nama,
        hirarki: selectedHirarki,
        deviceId,
        remember: $('remember').checked
      });
    }

    showToast(`Hello, ${nama.split(' ')[0]}!`, '✅');
    
    // Redirect ke home setelah 800ms
    setTimeout(() => {
      window.location.href = '/home.html';
    }, 800);

  } catch (err) {
    console.error(err);
    showToast('Failed to save session', '❌');
  } finally {
    isSubmitting = false;
    btnLogin.disabled = false;
    btnText.textContent = 'Sign In';
    $('btnArrow').style.display = 'grid';
  }
}

/* ============================================
   CONTACT ADMIN & FORGOT
   ============================================ */
$('contactAdmin').onclick = () => {
  const WA = '6281234567890';
  const msg = encodeURIComponent('Hi Admin, I need help with Y-HUB login.');
  window.open(`https://wa.me/${WA}?text=${msg}`, '_blank');
};

$('forgotBtn').onclick = e => {
  e.preventDefault();
  showModal({
    title: 'Reset Access',
    desc: 'Please contact your administrator to reset access or register a new device.',
    actions: [
      { label: 'Cancel', primary: false },
      { label: 'Contact Admin', primary: true, onClick: () => $('contactAdmin').click() }
    ]
  });
};

/* ============================================
   THEME
   ============================================ */
$('themeToggle').onclick = () => {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  $('themeToggle').textContent = isDark ? '☀️' : '🌙';
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
};
if (localStorage.getItem('theme') === 'dark') {
  document.body.classList.add('dark');
  $('themeToggle').textContent = '☀️';
}

/* ============================================
   INIT
   ============================================ */
renderHirarki();

let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });
</script>
