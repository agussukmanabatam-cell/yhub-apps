<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Y-Hub App</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Poppins', 'system-ui', 'sans-serif'],
                        heading: ['"Plus Jakarta Sans"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#dc2626">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Y-Hub App">
    <link rel="apple-touch-icon" href="/assets/images/icon-192x192.png">
    <link rel="icon" href="/assets/images/icon-192x192.png">

    <script src="auth-guard.js"></script>

    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Poppins', system-ui, sans-serif; }
        h1, h2, h3, h4, h5, h6, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }

        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.35;
            pointer-events: none;
            z-index: 0;
        }
        .bg-blob-1 { width: 200px; height: 200px; background: #fca5a5; top: 60px; left: -80px; }
        .bg-blob-2 { width: 180px; height: 180px; background: #93c5fd; top: 200px; right: -70px; }
        .bg-blob-3 { width: 220px; height: 220px; background: #fcd34d; bottom: 100px; left: -100px; opacity: 0.2; }

        .app-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-user-select: none;
            user-select: none;
            position: relative;
            z-index: 1;
        }
        .app-card:active { transform: scale(0.9); }

        .app-card .icon-wrap {
            width: 62px;
            height: 62px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: white;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08), 0 1px 3px rgba(0,0,0,0.04);
            transition: box-shadow 0.2s;
        }
        .app-card:hover .icon-wrap {
            box-shadow: 0 8px 24px rgba(0,0,0,0.12), 0 2px 6px rgba(0,0,0,0.06);
        }
        .app-card .icon-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .app-card .label {
            font-size: 11px;
            font-weight: 600;
            color: #374151;
            text-align: center;
            line-height: 1.2;
            max-width: 74px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .report-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            border-radius: 16px;
            background: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(0,0,0,0.03);
            position: relative;
            z-index: 1;
        }
        .report-card:active { transform: scale(0.97); }
        .report-card:hover {
            box-shadow: 0 6px 20px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.04);
            transform: translateY(-1px);
        }
        .report-card .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .report-card .icon-box svg {
            width: 22px;
            height: 22px;
            color: white;
        }
        .report-card .label {
            font-size: 12px;
            font-weight: 700;
            color: #1f2937;
            line-height: 1.3;
            flex: 1;
        }
        .report-card .chev {
            width: 16px;
            height: 16px;
            color: #9ca3af;
            flex-shrink: 0;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 800;
            color: #1f2937;
            letter-spacing: -0.01em;
            margin-bottom: 14px;
        }
        .section-title::before {
            content: '';
            width: 4px;
            height: 16px;
            border-radius: 4px;
            background: linear-gradient(to bottom, #dc2626, #f87171);
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in-up {
            animation: fadeInUp 0.4s ease-out both;
        }

        /* Event & Birthday card */
        .event-card {
            background: white;
            border-radius: 20px;
            padding: 14px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.03);
            display: flex;
            gap: 10px;
            position: relative;
            z-index: 1;
        }
        .event-card .info-box {
            flex: 1;
            display: flex;
            gap: 10px;
            align-items: flex-start;
            min-width: 0;
        }
        .event-card .icon-circle {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: white;
        }
        .event-card .label {
            font-size: 9px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #6b7280;
            margin-bottom: 2px;
        }
        .event-card .value {
            font-size: 12px;
            font-weight: 700;
            color: #1f2937;
            line-height: 1.3;
            word-break: break-word;
        }

        body.app-fullscreen #mobile-header,
        body.app-fullscreen #mobile-nav,
        body.app-fullscreen aside {
            display: none !important;
        }
        body.app-fullscreen #app-content {
            padding: 0 !important;
            overflow: hidden !important;
        }
        body.app-fullscreen #main-wrapper {
            padding-bottom: 0 !important;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans antialiased text-gray-800 h-screen overflow-hidden flex">
    <script>
        const __session = (typeof requireLogin === 'function') ? requireLogin() : null;
        if (!__session) { throw new Error('Not logged in'); }
        window.__session = __session;
    </script>

    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>

    <aside class="hidden md:flex flex-col w-64 bg-white border-r border-gray-200 h-full z-20 relative">
        <div class="h-16 flex items-center px-6 border-b border-gray-100">
            <div class="w-9 h-9 bg-gradient-to-br from-red-500 to-red-700 rounded-xl flex items-center justify-center mr-3 shadow-md shadow-red-200">
                <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            </div>
            <span class="font-heading font-bold text-lg text-gray-800">Y-Hub App</span>
        </div>

        <nav id="desktop-nav" class="flex-1 overflow-y-auto p-4 space-y-1"></nav>
        
        <div class="font-heading p-4 border-t border-gray-100 text-xs text-center text-gray-400">
            &copy; 2026 Y-Hub App
        </div>
    </aside>

    <div id="main-wrapper" class="flex-1 flex flex-col h-full relative">
        
        <header id="mobile-header" class="md:hidden bg-white/90 backdrop-blur-md shadow-sm h-16 flex items-center justify-between px-4 z-30 border-b border-gray-100">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 bg-gradient-to-br from-red-500 to-red-700 rounded-xl flex items-center justify-center shadow-md shadow-red-200">
                    <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                </div>
                <span class="font-heading font-bold text-gray-800">Y-Hub App</span>
            </div>
            <button onclick="logout()" class="font-heading text-xs font-semibold text-red-600 bg-red-50 hover:bg-red-100 px-3 py-1.5 rounded-full transition">
                Logout
            </button>
        </header>

        <main id="app-content" class="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8 relative z-10"></main>

        <nav id="mobile-nav" class="md:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 h-16 flex justify-around items-center z-30 pb-safe"></nav>
    </div>

    <script src="app.js"></script>
</body>
</html>
