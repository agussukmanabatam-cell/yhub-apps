<!DOCTYPE html>
<html>
<head>

    <title>Import Users — Y-Hub</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        button { padding: 12px 24px; font-size: 16px; cursor: pointer; background: #2563EB; color: white; border: none; border-radius: 8px; }
        button:disabled { opacity: 0.5; }
        pre { background: #f5f5f5; padding: 12px; border-radius: 8px; max-height: 400px; overflow: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Import 28 Users → Firestore</h1>
    <p>Klik tombol di bawah. Tunggu sampai selesai.</p>

        import { getFirestore, doc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBGuX3CiF8sEEfuNxcdJpRHetHl6ATtiVQ",
            authDomain: "y-hub-login.firebaseapp.com",
            projectId: "y-hub-login",
            storageBucket: "y-hub-login.firebasestorage.app",
            messagingSenderId: "439825695894",
            appId: "1:439825695894:web:45f6f388f9730af5342eb7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const USERS = [
            { "nik": "111311", "nama": "AGUS SUKMANA", "hirarki": "Ordinary Supervisor II" },
            { "nik": "180950", "nama": "AGUNG PRASTIYO", "hirarki": "Sales Staff" },

            { "nik": "191039", "nama": "ANDRIYANA MUKSIN", "hirarki": "Sales Staff" },

            { "nik": "160077", "nama": "CANGGIH SAIFUL RACHMAN", "hirarki": "Sales Staff" },
            { "nik": "180861", "nama": "DEDE ROSADI", "hirarki": "Sales Staff" },

            { "nik": "141117", "nama": "MEIRINA ANDREANY", "hirarki": "Center Coordinator" },

            { "nik": "180315", "nama": "NOVALIA NURFITRI ANDANI", "hirarki": "Sales Staff" },
            { "nik": "171385", "nama": "DEDE WIDIASTUTI", "hirarki": "Rayon Koordinator" }
        ];

        const btn = document.getElementById('btnImport');
        const log = document.getElementById('log');

        btn.onclick = async () => {
            btn.disabled = true;
            log.textContent = 'Mulai import...\n';
            let ok = 0, fail = 0;

            for (const u of USERS) {
                try {
                    await setDoc(doc(db, 'users', u.nik), {
                        nik: u.nik,
                        nama: u.nama,
                        hirarki: u.hirarki,
                        createdAt: serverTimestamp()
                    });
                    log.textContent += `✅ ${u.nik} — ${u.nama}\n`;
                    ok++;
                } catch (err) {
                    log.textContent += `❌ ${u.nik} — ${err.message}\n`;
                    fail++;
                }
            }

            log.textContent += `\n=== SELESAI ===\n✅ Berhasil: ${ok}\n❌ Gagal: ${fail}`;
            btn.textContent = '✅ Selesai';
        };
    </script>
</body>
