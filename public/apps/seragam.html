<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0284c7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Seragam Hari Ini</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0; padding: 0;
            -webkit-tap-highlight-color: transparent;
        }
        *::-webkit-scrollbar { display: none; }
        * { scrollbar-width: none; -ms-overflow-style: none; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #f0f9ff 0%, #f8fafc 40%, #ffffff 100%);
            color: #0f172a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            margin: 0;
            overflow-x: hidden;
        }
        .num { font-family: 'Plus Jakarta Sans', sans-serif; font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }

        .app-container {
            width: 100%;
            max-width: 460px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            background: transparent;
        }

        /* ================= HEADER ================= */
        .app-header {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            padding: 14px 20px 20px;
            padding-top: calc(14px + env(safe-area-inset-top));
            border-radius: 0 0 28px 28px;
            box-shadow: 0 12px 32px -10px rgba(2, 132, 199, 0.45);
            position: relative;
            overflow: hidden;
            z-index: 20;
            flex-shrink: 0;
        }
        .app-header::before {
            content: '';
            position: absolute;
            width: 180px; height: 180px;
            border-radius: 50%;
            background: rgba(255,255,255,0.08);
            top: -60px; right: -40px;
        }
        .app-header::after {
            content: '';
            position: absolute;
            width: 120px; height: 120px;
            border-radius: 50%;
            background: rgba(255,255,255,0.06);
            bottom: -40px; left: -30px;
        }
        .app-header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }
        .app-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .app-header-icon {
            width: 34px; height: 34px;
            border-radius: 11px;
            background: rgba(255,255,255,0.18);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .app-header-title-text p:first-child {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0.75;
            line-height: 1;
        }
        .app-header-title-text p:last-child {
            font-size: 15px;
            font-weight: 800;
            margin-top: 3px;
            letter-spacing: -0.01em;
            line-height: 1;
        }
        .header-btn {
            width: 38px; height: 38px;
            border-radius: 12px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            color: white;
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
        }
        .header-btn:active {
            transform: scale(0.94);
            background: rgba(255,255,255,0.28);
        }

        /* Hero date display */
        .hero-date-block {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            position: relative;
            z-index: 2;
            gap: 10px;
        }
        .hero-day-name {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1;
        }
        .hero-date-full {
            font-size: 12px;
            font-weight: 500;
            opacity: 0.85;
            margin-top: 6px;
            letter-spacing: 0.02em;
        }
        .day-indicator {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .day-indicator.is-today {
            background: #fbbf24;
            color: #422006;
            border-color: transparent;
            box-shadow: 0 4px 12px -3px rgba(251, 191, 36, 0.6);
        }

        /* ================= MAIN ================= */
        .main-content {
            flex: 1;
            padding: 16px 16px 0;
            padding-bottom: calc(140px + env(safe-area-inset-bottom));
            overflow-y: auto;
            overflow-x: hidden;
        }

        /* ================= SWIPE DECK ================= */
        .deck-wrapper {
            position: relative;
            border-radius: 28px;
            overflow: hidden;
            background: #ffffff;
            box-shadow: 0 12px 40px -12px rgba(15, 23, 42, 0.18), 0 2px 6px rgba(15, 23, 42, 0.04);
            border: 1px solid rgba(226, 232, 240, 0.6);
            margin-bottom: 14px;
            user-select: none;
            touch-action: pan-y;
        }
        .deck-inner {
            padding: 20px 20px 22px;
            position: relative;
        }

        /* Top accent line */
        .deck-wrapper::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: linear-gradient(90deg, #0284c7, #38bdf8, #818cf8);
            z-index: 5;
        }

        .deck-badge-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }
        .deck-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: rgba(2, 132, 199, 0.1);
            color: #0284c7;
            border: 1px solid rgba(2, 132, 199, 0.18);
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .deck-badge .dot-live {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
            animation: pulseDot 1.8s ease-in-out infinite;
        }
        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.45; transform: scale(0.85); }
        }

        .deck-nav-arrows {
            display: flex;
            gap: 6px;
        }
        .nav-arrow {
            width: 32px; height: 32px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.15s;
        }
        .nav-arrow:active {
            background: #e2e8f0;
            transform: scale(0.94);
        }
        .nav-arrow:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .uniform-stage {
            background: linear-gradient(180deg, #f8fafc 0%, #ffffff 100%);
            border: 1px solid #f1f5f9;
            border-radius: 22px;
            padding: 16px;
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            margin-bottom: 18px;
        }
        .uniform-stage::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 100%, rgba(2, 132, 199, 0.06) 0%, transparent 60%);
            pointer-events: none;
        }
        .uniform-img {
            max-width: 100%;
            max-height: 340px;
            object-fit: contain;
            display: block;
            position: relative;
            z-index: 2;
            transition: opacity 0.28s ease, transform 0.28s ease;
        }
        .uniform-img.switching {
            opacity: 0;
            transform: scale(0.96);
        }

        .uniform-name {
            font-size: 22px;
            font-weight: 800;
            color: #0f172a;
            text-align: center;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 12px;
        }
        .uniform-name.muted {
            color: #94a3b8;
            font-size: 18px;
            font-weight: 600;
        }

        .activity-note {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            margin: 0 auto;
            width: max-content;
            max-width: 100%;
            word-break: break-word;
            transition: all 0.25s;
            text-align: center;
        }
        .activity-wrap {
            display: flex;
            justify-content: center;
        }

        /* Swipe feedback arrows */
        .swipe-feedback {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(2, 132, 199, 0.9);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .swipe-feedback.left  { left: 12px; }
        .swipe-feedback.right { right: 12px; }
        .swipe-feedback.show { opacity: 1; }

        /* ================= PREVIEW STRIP ================= */
        .preview-strip {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            padding: 4px 0;
        }
        .preview-card {
            flex: 1;
            border-radius: 16px;
            padding: 10px 10px 12px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            min-width: 0;
            position: relative;
            overflow: hidden;
        }
        .preview-card:active {
            transform: scale(0.96);
        }
        .preview-card.is-active {
            border-color: #0284c7;
            background: linear-gradient(180deg, #f0f9ff, #ffffff);
            box-shadow: 0 6px 16px -6px rgba(2, 132, 199, 0.35);
        }
        .preview-card.is-active::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #0284c7, #38bdf8);
        }
        .preview-card.is-disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .preview-label {
            font-size: 9px;
            font-weight: 800;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 4px;
        }
        .preview-card.is-active .preview-label {
            color: #0284c7;
        }
        .preview-date {
            font-size: 12px;
            font-weight: 800;
            color: #0f172a;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .preview-card.is-active .preview-date {
            color: #0369a1;
        }
        .preview-uniform-dot {
            width: 22px; height: 22px;
            border-radius: 8px;
            margin: 6px auto 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            color: white;
        }

        /* ================= LEGEND ROW ================= */
        .legend-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 12px;
            border-radius: 16px;
            background: rgba(248, 250, 252, 0.7);
            border: 1px solid #f1f5f9;
            flex-wrap: wrap;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 10.5px;
            font-weight: 600;
            color: #475569;
        }
        .legend-dot {
            width: 10px; height: 10px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .dot-blue   { background: #0284c7; }
        .dot-yellow { background: #d97706; }
        .dot-red    { background: #dc2626; }

        /* ================= BOTTOM BAR ================= */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 460px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-top: 1px solid rgba(226, 232, 240, 0.7);
            padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 30;
            box-shadow: 0 -6px 24px rgba(15, 23, 42, 0.05);
        }
        .btn-primary {
            flex: 1;
            background: linear-gradient(135deg, #0284c7, #0369a1);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 13px 16px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.01em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            box-shadow: 0 8px 20px -8px rgba(2, 132, 199, 0.6);
            transition: all 0.15s;
        }
        .btn-primary:active {
            transform: scale(0.97);
            filter: brightness(0.96);
        }
        .btn-primary:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none;
        }
        .btn-icon {
            width: 46px; height: 46px;
            border-radius: 14px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            color: #0284c7;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.15s;
            flex-shrink: 0;
            position: relative;
        }
        .btn-icon:active {
            transform: scale(0.94);
            background: #f8fafc;
        }
        .btn-icon.has-badge::after {
            content: '';
            position: absolute;
            top: 6px; right: 6px;
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #ef4444;
            border: 2px solid #ffffff;
        }

        /* ================= MODAL ================= */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            z-index: 100;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            opacity: 0;
            transition: opacity 0.24s ease;
        }
        .modal.show {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 1;
        }
        .modal-content {
            background: #ffffff;
            border-radius: 28px 28px 0 0;
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            max-height: 85vh;
            padding-bottom: env(safe-area-inset-bottom);
            transform: translateY(100%);
            transition: transform 0.32s cubic-bezier(.32,.72,0,1);
            box-shadow: 0 -20px 60px rgba(15, 23, 42, 0.25);
        }
        .modal.show .modal-content {
            transform: translateY(0);
        }
        .modal-drag-handle {
            display: flex;
            justify-content: center;
            padding: 12px 0 4px;
        }
        .modal-drag-handle > div {
            width: 40px; height: 4px;
            border-radius: 2px;
            background: #e2e8f0;
        }
        .modal-header {
            padding: 12px 20px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #f1f5f9;
        }
        .modal-header h3 {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.01em;
        }
        .modal-close-btn {
            width: 32px; height: 32px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            cursor: pointer;
        }
        .modal-close-btn:active {
            background: #e2e8f0;
        }
        .schedule-list {
            overflow-y: auto;
            padding: 8px 12px 16px;
            flex: 1;
        }
        .schedule-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 12px;
            border-radius: 14px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background 0.15s;
        }
        .schedule-item:active {
            background: #f0f9ff;
        }
        .schedule-item.is-current {
            background: linear-gradient(135deg, #e0f2fe, #f0f9ff);
            border: 1px solid #bae6fd;
        }
        .schedule-swatch {
            width: 10px;
            height: 36px;
            border-radius: 4px;
            flex-shrink: 0;
        }
        .schedule-info {
            flex: 1;
            min-width: 0;
        }
        .schedule-date {
            font-size: 12px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -0.005em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .schedule-uniform {
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .schedule-item.is-current .schedule-date { color: #0369a1; }
        .schedule-item.is-current .schedule-uniform { color: #0284c7; }
        .schedule-arrow {
            color: #cbd5e1;
            font-size: 11px;
            flex-shrink: 0;
        }

        /* ================= TOAST ================= */
        #toast {
            position: fixed;
            bottom: calc(90px + env(safe-area-inset-bottom));
            left: 50%;
            transform: translate(-50%, 20px);
            background: #0f172a;
            color: white;
            font-size: 12px;
            font-weight: 700;
            padding: 12px 20px;
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
            z-index: 200;
            white-space: nowrap;
            max-width: 90vw;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* Skeleton */
        .skeleton {
            background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- ================= HEADER ================= -->
    <div class="app-header">
        <div class="app-header-top">
            <div class="app-header-title">
                <div class="app-header-icon">
                    <i class="fa-solid fa-shirt"></i>
                </div>
                <div class="app-header-title-text">
                    <p>Jadwal</p>
                    <p>Seragam</p>
                </div>
            </div>
            <div style="display:flex; gap:6px;">
                <button class="header-btn" onclick="jumpToToday()" id="jumpTodayBtn" title="Hari ini" style="display:none;">
                    <i class="fa-solid fa-location-crosshairs"></i>
                </button>
                <button class="header-btn" onclick="refreshData()" id="refreshBtn" title="Refresh">
                    <i class="fa-solid fa-rotate-right"></i>
                </button>
            </div>
        </div>

        <div class="hero-date-block">
            <div style="min-width:0;">
                <p class="hero-day-name" id="heroDayName">Memuat...</p>
                <p class="hero-date-full" id="heroDateFull">&nbsp;</p>
            </div>
            <div class="day-indicator" id="dayIndicator">—</div>
        </div>
    </div>

    <!-- ================= MAIN ================= -->
    <div class="main-content" id="mainContent">

        <!-- SWIPE DECK -->
        <div class="deck-wrapper" id="swipeArea">
            <div class="swipe-feedback left" id="fbLeft"><i class="fa-solid fa-chevron-left"></i></div>
            <div class="swipe-feedback right" id="fbRight"><i class="fa-solid fa-chevron-right"></i></div>

            <div class="deck-inner">
                <div class="deck-badge-row">
                    <div class="deck-badge">
                        <span class="dot-live"></span>
                        <span id="badgeText">Seragam Hari Ini</span>
                    </div>
                    <div class="deck-nav-arrows">
                        <button class="nav-arrow" id="prevBtn" onclick="changeDay(-1)" title="Sebelumnya">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button class="nav-arrow" id="nextBtn" onclick="changeDay(1)" title="Berikutnya">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <div class="uniform-stage">
                    <img id="uniformImg" class="uniform-img skeleton" style="min-height:260px;min-width:200px;" alt="Seragam" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==">
                </div>

                <h2 class="uniform-name" id="uniformName">Memuat...</h2>
                <div class="activity-wrap">
                    <div class="activity-note" id="activityNote">Harap tunggu</div>
                </div>
            </div>
        </div>

        <!-- PREVIEW STRIP -->
        <div class="preview-strip" id="previewStrip"></div>

        <!-- LEGEND -->
        <div class="legend-row">
            <div class="legend-item"><span class="legend-dot dot-blue"></span> Seragam Light</div>
            <div class="legend-item"><span class="legend-dot dot-yellow"></span> Seragam Mangga</div>
            <div class="legend-item"><span class="legend-dot dot-red"></span> Cintai Ususmu</div>
        </div>

    </div>

    <!-- ================= BOTTOM BAR ================= -->
    <div class="bottom-bar">
        <button class="btn-icon" onclick="toggleModal()" title="Jadwal Lengkap" id="calendarBtn">
            <i class="fa-regular fa-calendar-days"></i>
        </button>
        <button class="btn-primary" onclick="shareWhatsApp()" id="shareBtn">
            <i class="fa-brands fa-whatsapp"></i>
            <span>Bagikan Jadwal</span>
        </button>
    </div>

    <!-- ================= MODAL BOTTOM SHEET ================= -->
    <div class="modal" id="calendarModal" onclick="if(event.target===this) toggleModal()">
        <div class="modal-content">
            <div class="modal-drag-handle"><div></div></div>
            <div class="modal-header">
                <h3>Jadwal Lengkap</h3>
                <button class="modal-close-btn" onclick="toggleModal()">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <div class="schedule-list" id="scheduleListContainer"></div>
        </div>
    </div>

    <!-- TOAST -->
    <div id="toast"></div>

</div>

<script>
/* ============================================================
 * CONFIG
 * ============================================================ */
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSCp3DY8YrJP9Bmy1eO6-w6LJzuUj5Iq9cVNnPiJKjpF91Hcei7o4Q5-2i7rTQbrcmT6hCHotfTmU5u/pub?gid=1388278707&single=true&output=csv';
const CACHE_KEY = 'seragam_cache_v1';
const CACHE_TTL = 1000 * 60 * 60 * 6; // 6 jam
const LS_LAST_INDEX = 'seragam_last_index';

const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Ags','Sep','Okt','Nov','Des'];
const DAYS_ID = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];

const $ = id => document.getElementById(id);
const haptic = (ms = 8) => { try { navigator.vibrate?.(ms); } catch(_){} };

const imageMap = {
    "Seragam Biasa": "https://drive.google.com/uc?export=download&id=1Z1OVIIAwWSFUch0nhtl9ky2uxPea7YgK"
};

/* ============================================================
 * STATE
 * ============================================================ */
let scheduleData = [];
let currentIndex = 0;
let todayIndex = 0;

/* ============================================================
 * CSV
 * ============================================================ */
function parseCSVRow(str) {
    let arr = [], quote = false, col = '';
    for (let i = 0; i < str.length; i++) {
        const cc = str[i], nc = str[i+1];
        if (cc === '"' && quote && nc === '"') { col += '"'; ++i; continue; }
        if (cc === '"') { quote = !quote; continue; }
        if (cc === ',' && !quote) { arr.push(col.trim()); col = ''; continue; }
        col += cc;
    }
    arr.push(col.trim());
    return arr;
}

function processCSV(text) {
    scheduleData = [];
    const rows = text.split(/\r?\n/);

    for (let i = 1; i < rows.length; i++) {
        if (!rows[i].trim()) continue;
        const columns = parseCSVRow(rows[i]);
        if (columns.length === 0) continue;

        const dateStr = (columns[0] || '').trim();
        if (!dateStr) continue;

        const dayStr = (columns[1] || '').trim();
        const fullDateStr = dayStr ? `${dayStr}, ${dateStr}` : dateStr;

        const activityStr = (columns[2] || '').trim() || '-';
        const uniformBaseStr = (columns[3] || '').trim() || 'Belum Ada Seragam';
        const extraStr = (columns[5] || '').trim();
        const uniformStr = extraStr ? `${uniformBaseStr} - ${extraStr}` : uniformBaseStr;

        let imageUrlStr = (columns[4] || '').trim();
        if (imageUrlStr.includes('drive.google.com')) {
            let fileId = '';
            if (imageUrlStr.includes('id=')) {
                const m = imageUrlStr.match(/id=([^&]+)/);
                if (m) fileId = m[1];
            } else if (imageUrlStr.includes('/d/')) {
                const m = imageUrlStr.match(/\/d\/([a-zA-Z0-9_-]+)/);
                if (m) fileId = m[1];
            }
            if (fileId) imageUrlStr = `https://drive.google.com/thumbnail?id=${fileId}&sz=w800`;
        }
        if (!imageUrlStr && imageMap[uniformBaseStr]) imageUrlStr = imageMap[uniformBaseStr];

        // Warna kategori
        const lower = uniformStr.toLowerCase();
        let accent = '#0284c7', accentSoft = 'rgba(2,132,199,0.1)';
        if (lower.includes('mangga')) { accent = '#d97706'; accentSoft = 'rgba(217,119,6,0.1)'; }
        else if (lower.includes('cintai') || lower.includes('merah') || lower.includes('libur')) { accent = '#dc2626'; accentSoft = 'rgba(220,38,38,0.1)'; }

        scheduleData.push({
            date: fullDateStr,
            dateRaw: dateStr,
            image: imageUrlStr || 'https://placehold.co/400x400/ffffff/64748b?text=Tidak+Ada+Gambar',
            name: uniformStr,
            activity: activityStr,
            accent,
            accentSoft,
        });
    }
}

/* ============================================================
 * CACHE
 * ============================================================ */
function readCache() {
    try {
        const raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        const obj = JSON.parse(raw);
        if (!obj || !obj.text) return null;
        return obj;
    } catch(_) { return null; }
}
function writeCache(text) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ text, ts: Date.now() })); } catch(_) {}
}

/* ============================================================
 * FETCH
 * ============================================================ */
async function refreshData(force = false) {
    if (!force) {
        const c = readCache();
        if (c) {
            try {
                processCSV(c.text);
                afterLoad();
                if (Date.now() - c.ts > CACHE_TTL) silentRefresh();
                return;
            } catch(_) {}
        }
    }

    $('refreshBtn').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

    try {
        const res = await fetch(CSV_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        processCSV(text);
        writeCache(text);
        afterLoad();
    } catch(err) {
        console.error(err);
        const c = readCache();
        if (c) {
            try { processCSV(c.text); afterLoad(); showToast('Mode offline — pakai data tersimpan'); }
            catch(_) { showError(); }
        } else showError();
    } finally {
        $('refreshBtn').innerHTML = '<i class="fa-solid fa-rotate-right"></i>';
    }
}

async function silentRefresh() {
    try {
        const res = await fetch(CSV_URL, { cache: 'no-store' });
        if (!res.ok) return;
        const text = await res.text();
        writeCache(text);
        // Jangan override posisi kalau user sedang swipe
        if (scheduleData.length === 0) {
            processCSV(text);
            afterLoad();
        }
    } catch(_) {}
}

function showError() {
    $('uniformName').innerText = 'Gagal Memuat Data';
    $('uniformName').className = 'uniform-name muted';
    $('heroDayName').innerText = 'Error';
    $('heroDateFull').innerText = 'Periksa koneksi lalu tap refresh';
    $('activityNote').innerText = '—';
}

/* ============================================================
 * AFTER LOAD — find today, restore last index, update UI
 * ============================================================ */
function afterLoad() {
    if (scheduleData.length === 0) return;

    todayIndex = findTodayIndex();
    currentIndex = todayIndex;

    // Restore index kalau sebelumnya user lagi lihat hari lain
    try {
        const saved = parseInt(localStorage.getItem(LS_LAST_INDEX));
        if (!isNaN(saved) && saved >= 0 && saved < scheduleData.length && saved !== todayIndex) {
            currentIndex = saved;
        }
    } catch(_) {}

    updateUI(false);
}

function findTodayIndex() {
    const today = new Date();
    const d = today.getDate();
    const monthName = MONTHS[today.getMonth()];
    const d2 = d < 10 ? '0' + d : '' + d;

    for (let i = 0; i < scheduleData.length; i++) {
        const raw = scheduleData[i].dateRaw || scheduleData[i].date;
        if (raw.includes(`${d} ${monthName}`) || raw.includes(`${d2} ${monthName}`)) return i;
    }
    return 0;
}

function isToday(idx) { return idx === todayIndex; }

function getDayLabel(idx) {
    if (idx === todayIndex) return 'Hari Ini';
    if (idx === todayIndex - 1) return 'Kemarin';
    if (idx === todayIndex + 1) return 'Besok';
    if (idx === todayIndex + 2) return 'Lusa';
    const diff = idx - todayIndex;
    return diff > 0 ? `+${diff} hari` : `${diff} hari`;
}

/* ============================================================
 * UI UPDATE
 * ============================================================ */
function updateUI(animate = true) {
    if (scheduleData.length === 0) return;
    const data = scheduleData[currentIndex];

    // Header
    const parts = (data.date || '').split(',');
    const dayName = parts[0] ? parts[0].trim() : '';
    const dateFull = parts[1] ? parts[1].trim() : data.date;

    $('heroDayName').innerText = dayName || 'Hari';
    $('heroDateFull').innerText = dateFull;

    const ind = $('dayIndicator');
    ind.innerText = getDayLabel(currentIndex);
    ind.className = 'day-indicator' + (isToday(currentIndex) ? ' is-today' : '');

    // Badge
    $('badgeText').innerText = isToday(currentIndex) ? 'Seragam Hari Ini' : 'Jadwal Seragam';

    // Uniform image (with switching animation)
    const img = $('uniformImg');
    img.classList.add('switching');

    setTimeout(() => {
        img.classList.remove('skeleton');
        img.src = data.image;
        img.onload = () => img.classList.remove('switching');
        img.onerror = () => {
            img.onerror = null;
            img.src = 'https://placehold.co/400x400/ffffff/dc2626?text=Gambar+Gagal+Dimuat';
        };
        setTimeout(() => img.classList.remove('switching'), 80);
    }, animate ? 140 : 0);

    // Name
    const nm = $('uniformName');
    if (data.name && data.name !== 'Belum Ada Seragam') {
        nm.innerText = data.name;
        nm.className = 'uniform-name';
    } else {
        nm.innerText = 'Belum ada jadwal';
        nm.className = 'uniform-name muted';
    }

    // Activity note
    const note = $('activityNote');
    note.innerText = data.activity || '—';
    note.style.background = data.accentSoft;
    note.style.color = data.accent;
    note.style.border = `1px solid ${data.accent}22`;

    // Nav arrows state
    $('prevBtn').disabled = currentIndex === 0;
    $('nextBtn').disabled = currentIndex === scheduleData.length - 1;

    // Jump to today button
    $('jumpTodayBtn').style.display = isToday(currentIndex) ? 'none' : 'flex';

    // Preview strip
    renderPreviewStrip();

    // Modal current
    document.querySelectorAll('.schedule-item').forEach(el => {
        el.classList.toggle('is-current', parseInt(el.dataset.idx) === currentIndex);
    });

    // Save index
    try { localStorage.setItem(LS_LAST_INDEX, currentIndex); } catch(_) {}
}

/* ============================================================
 * PREVIEW STRIP
 * ============================================================ */
function renderPreviewStrip() {
    const strip = $('previewStrip');
    strip.innerHTML = '';

    const indices = [currentIndex - 1, currentIndex, currentIndex + 1];

    indices.forEach((idx, i) => {
        const card = document.createElement('div');
        const label = i === 0 ? 'Sebelumnya' : (i === 1 ? 'Sekarang' : 'Berikutnya');
        card.className = 'preview-card';
        if (idx === currentIndex) card.classList.add('is-active');
        if (idx < 0 || idx >= scheduleData.length) {
            card.classList.add('is-disabled');
            card.innerHTML = `
                <p class="preview-label">${label}</p>
                <p class="preview-date">—</p>
            `;
        } else {
            const d = scheduleData[idx];
            const parts = (d.date || '').split(',');
            const dayName = parts[0] ? parts[0].trim() : '';
            const dateShort = parts[1] ? parts[1].trim() : d.date;
            // Ambil tanggal + bulan singkat
            const short = dateShort.replace(/ \d{4}$/, '');
            card.innerHTML = `
                <p class="preview-label">${label}</p>
                <p class="preview-date">${short}</p>
                <div class="preview-uniform-dot" style="background:${d.accent}">
                    <i class="fa-solid fa-shirt" style="font-size:9px;"></i>
                </div>
            `;
            card.onclick = () => {
                haptic(8);
                currentIndex = idx;
                updateUI(true);
            };
        }
        strip.appendChild(card);
    });
}

/* ============================================================
 * SWIPE
 * ============================================================ */
let touchStartX = 0, touchStartY = 0, touchEndX = 0, touchEndY = 0;
let swiping = false;
const swipeArea = $('swipeArea');

swipeArea.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
    swiping = true;
}, { passive: true });

swipeArea.addEventListener('touchmove', e => {
    if (!swiping) return;
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if (Math.abs(dx) > 20 && Math.abs(dx) > Math.abs(dy)) {
        const fb = dx > 0 ? $('fbLeft') : $('fbRight');
        fb.classList.add('show');
    }
}, { passive: true });

swipeArea.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    touchEndY = e.changedTouches[0].screenY;
    swiping = false;
    $('fbLeft').classList.remove('show');
    $('fbRight').classList.remove('show');
    handleSwipe();
}, { passive: true });

function handleSwipe() {
    const dx = touchEndX - touchStartX;
    const dy = touchEndY - touchStartY;
    if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return;
    haptic(10);
    if (dx < 0) changeDay(1);
    else changeDay(-1);
}

/* ============================================================
 * NAVIGATION
 * ============================================================ */
function changeDay(direction) {
    if (scheduleData.length === 0) return;
    const newIdx = currentIndex + direction;
    if (newIdx < 0 || newIdx >= scheduleData.length) return;
    currentIndex = newIdx;
    updateUI(true);
}

function jumpToToday() {
    if (scheduleData.length === 0) return;
    haptic(12);
    currentIndex = todayIndex;
    updateUI(true);
    showToast('Balik ke hari ini ✓');
}

/* ============================================================
 * MODAL
 * ============================================================ */
function toggleModal() {
    haptic(8);
    const modal = $('calendarModal');
    const isOpen = modal.classList.contains('show');
    if (isOpen) {
        modal.classList.remove('show');
        setTimeout(() => { modal.style.display = 'none'; }, 240);
    } else {
        modal.style.display = 'flex';
        buildScheduleList();
        requestAnimationFrame(() => modal.classList.add('show'));
    }
}

function buildScheduleList() {
    const container = $('scheduleListContainer');
    container.innerHTML = '';

    if (scheduleData.length === 0) {
        container.innerHTML = '<p style="padding:20px;text-align:center;color:#94a3b8;font-size:12px;">Belum ada jadwal</p>';
        return;
    }

    // Info singkat: jumlah jadwal
    const info = document.createElement('div');
    info.style.cssText = 'padding:8px 12px 12px;font-size:11px;color:#64748b;font-weight:600;';
    info.innerHTML = `<i class="fa-regular fa-calendar" style="margin-right:6px;"></i>${scheduleData.length} jadwal tersedia`;
    container.appendChild(info);

    scheduleData.forEach((item, idx) => {
        const div = document.createElement('div');
        div.className = 'schedule-item' + (idx === currentIndex ? ' is-current' : '');
        div.dataset.idx = idx;

        const parts = (item.date || '').split(',');
        const dayName = parts[0] ? parts[0].trim() : '';
        const dateFull = parts[1] ? parts[1].trim() : item.date;

        div.innerHTML = `
            <div class="schedule-swatch" style="background:${item.accent}"></div>
            <div class="schedule-info">
                <p class="schedule-date">${dayName} · ${dateFull}${idx === todayIndex ? ' · <span style="color:#f59e0b;">Hari ini</span>' : ''}</p>
                <p class="schedule-uniform">${item.name}</p>
            </div>
            <i class="fa-solid fa-chevron-right schedule-arrow"></i>
        `;
        div.onclick = () => {
            haptic(10);
            currentIndex = idx;
            updateUI(true);
            toggleModal();
        };
        container.appendChild(div);
    });
}

/* ============================================================
 * SHARE
 * ============================================================ */
function shareWhatsApp() {
    if (scheduleData.length === 0) { showToast('Data belum siap'); return; }
    haptic(12);
    const d = scheduleData[currentIndex];

    const parts = (d.date || '').split(',');
    const dayName = parts[0] ? parts[0].trim() : '';
    const dateFull = parts[1] ? parts[1].trim() : d.date;

    const label = isToday(currentIndex) ? 'Hari ini' :
                  (currentIndex === todayIndex + 1 ? 'Besok' :
                  (currentIndex === todayIndex - 1 ? 'Kemarin' : dayName));

    let text = `👕 *Jadwal Seragam*\n` +
               `${dayName}, ${dateFull}\n\n` +
               `📌 ${d.name}\n` +
               `🎯 ${d.activity}\n\n` +
               `_${label} — Jangan sampai salah seragam ya ✨_`;

    const waUrl = 'https://wa.me/?text=' + encodeURIComponent(text);
    const win = window.open(waUrl, '_blank');
    if (!win) window.location.href = waUrl;
}

/* ============================================================
 * TOAST
 * ============================================================ */
let toastTimer = null;
function showToast(msg) {
    const t = $('toast');
    t.innerText = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
}

/* ============================================================
 * KEYBOARD (desktop shortcut)
 * ============================================================ */
document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  changeDay(-1);
    if (e.key === 'ArrowRight') changeDay(1);
    if (e.key === 'Escape') {
        const m = $('calendarModal');
        if (m.classList.contains('show')) toggleModal();
    }
});

/* ============================================================
 * BOOT
 * ============================================================ */
refreshData();
</script>
</body>
</html>
